; ============================================================================
; Supervisor config for Tequila POS background workers
; Managed by Docker – do not edit inside the container directly.
; ============================================================================

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
environment=DB_HOST="database",DB_PORT="3306",DB_DATABASE="tequila_pos",DB_USERNAME="tequila",DB_PASSWORD="tequila",QUEUE_CONNECTION="database",REDIS_HOST="cache",REDIS_PORT="6379",REDIS_CLIENT="predis",REDIS_PREFIX="tequila_live_",CACHE_DRIVER="redis",BROADCAST_DRIVER="redis",BROWSERSHOT_NODE_BINARY="/usr/bin/node",BROWSERSHOT_NPM_BINARY="/usr/bin/npm",BROWSERSHOT_CHROME_PATH="/usr/bin/chromium"

[program:laravel-scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DB_HOST="database",DB_PORT="3306",DB_DATABASE="tequila_pos",DB_USERNAME="tequila",DB_PASSWORD="tequila",QUEUE_CONNECTION="database",REDIS_HOST="cache",REDIS_PORT="6379",REDIS_CLIENT="predis",REDIS_PREFIX="tequila_live_",CACHE_DRIVER="redis",BROADCAST_DRIVER="redis",BROWSERSHOT_NODE_BINARY="/usr/bin/node",BROWSERSHOT_NPM_BINARY="/usr/bin/npm",BROWSERSHOT_CHROME_PATH="/usr/bin/chromium"

[program:echo-server]
directory=/var/www/html
command=laravel-echo-server start --force --config=/var/www/html/laravel-echo-server.docker.json
autostart=true
autorestart=true
;user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/echo-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=10
environment=DB_HOST="database",DB_PORT="3306",DB_DATABASE="tequila_pos",DB_USERNAME="tequila",DB_PASSWORD="tequila",QUEUE_CONNECTION="database",REDIS_HOST="cache",REDIS_PORT="6379",REDIS_CLIENT="predis",REDIS_PREFIX="tequila_live_",CACHE_DRIVER="redis",BROADCAST_DRIVER="redis",BROWSERSHOT_NODE_BINARY="/usr/bin/node",BROWSERSHOT_NPM_BINARY="/usr/bin/npm",BROWSERSHOT_CHROME_PATH="/usr/bin/chromium"
