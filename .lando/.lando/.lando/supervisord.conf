; ============================================================================
; Supervisor config for Tequila POS background workers
; Managed by Lando – do not edit inside the container directly.
; ============================================================================

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --sleep=3 --tries=3 --timeout=90
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/app/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
environment=DB_HOST="database",DB_PORT="3306",DB_DATABASE="tequila_pos",DB_USERNAME="tequila",DB_PASSWORD="tequila",QUEUE_CONNECTION="database",REDIS_HOST="cache",REDIS_PORT="6379",REDIS_CLIENT="predis",CACHE_DRIVER="redis",BROADCAST_DRIVER="redis",BROWSERSHOT_NODE_BINARY="/usr/bin/node",BROWSERSHOT_NPM_BINARY="/usr/bin/npm",BROWSERSHOT_CHROME_PATH="/usr/bin/chromium",RESTAURANT_ID="88",CLOUD_API_AUTH_KEY="7b9d9633-b898-4280-902e-f0c81575ed45"

[program:laravel-scheduler]
process_name=%(program_name)s
command=php /app/artisan schedule:work --no-interaction
directory=/app
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/app/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DB_HOST="database",DB_PORT="3306",DB_DATABASE="tequila_pos",DB_USERNAME="tequila",DB_PASSWORD="tequila",QUEUE_CONNECTION="database",REDIS_HOST="cache",REDIS_PORT="6379",REDIS_CLIENT="predis",CACHE_DRIVER="redis",BROADCAST_DRIVER="redis",BROWSERSHOT_NODE_BINARY="/usr/bin/node",BROWSERSHOT_NPM_BINARY="/usr/bin/npm",BROWSERSHOT_CHROME_PATH="/usr/bin/chromium",RESTAURANT_ID="88",CLOUD_API_AUTH_KEY="7b9d9633-b898-4280-902e-f0c81575ed45"

[program:echo-server]
directory=/app
command=laravel-echo-server start --force --config=/app/laravel-echo-server.lando.json
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/app/storage/logs/echo-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=10
environment=NODE_ENV=production,RESTAURANT_ID="88",CLOUD_API_AUTH_KEY="7b9d9633-b898-4280-902e-f0c81575ed45"
